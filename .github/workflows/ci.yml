name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core shellcheck jq bash

      - name: cue-alexa — shellcheck
        working-directory: cue-alexa
        run: shellcheck bin/cue-alexa lib/*.sh install.sh
      - name: cue-alexa — bats
        working-directory: cue-alexa
        run: bats tests/unit/*.bats tests/integration/*.bats

      - name: cue — shellcheck
        working-directory: cue
        run: shellcheck bin/cue lib/*.sh install.sh share/completions/cue.bash
      - name: cue — bats
        working-directory: cue
        run: bats tests/unit/*.bats

      - name: cue-google — shellcheck
        working-directory: cue-google
        run: shellcheck bin/cue-google lib/*.sh install.sh share/completions/cue-google.bash
      - name: cue-google — bats
        working-directory: cue-google
        run: bats tests/bash/*.bats
      - name: cue-google — pytest (mocked; no google libs needed)
        working-directory: cue-google
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q
